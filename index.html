<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مُستكشِف العلوم | اكتشف وتعلّم – الصف الأول الإعدادى</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fb;--card:#ffffff;--text:#2b1d4a;--muted:#6b5b8c;--border:#eadcff;--tint:#f3e8ff;--bot:#f6f0ff;--ok:#16a34a;--bad:#dc2626;--p:#7c3aed;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#120b2e;--card:#1d1445;--text:#f5eeff;--muted:#b9a8e6;--border:#3b2b78;--tint:#2b1d63;--bot:#241a57;--p:#a78bfa;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',Tahoma,Arial,sans-serif}
h1,h2,h3,.big,.tile b,.lcard b{font-family:'Lalezar','Tajawal',sans-serif;font-weight:400;letter-spacing:.2px}
body{background:var(--bg);background-image:radial-gradient(circle at 8% 8%,rgba(236,72,153,.18),transparent 38%),radial-gradient(circle at 92% 18%,rgba(6,182,212,.18),transparent 38%),radial-gradient(circle at 50% 95%,rgba(245,158,11,.18),transparent 42%);background-attachment:fixed;color:var(--text);line-height:1.75;min-height:100vh}
header{position:relative;overflow:hidden;text-align:center;color:#fff;padding:30px 16px 42px;border-radius:0 0 40px 40px;background:linear-gradient(120deg,#7c3aed,#ec4899 45%,#f59e0b);background-size:200% 200%;animation:bgm 10s ease infinite;text-shadow:0 3px 8px rgba(0,0,0,.25);box-shadow:0 10px 30px rgba(124,58,237,.35)}
header h1{font-size:2.6rem;line-height:1.3}
header:before,header:after{content:'⚛️ 🧪 🔬 🌍 🧲';position:absolute;font-size:1.6rem;opacity:.35;white-space:nowrap;animation:drift 14s linear infinite}
header:before{top:10px;right:-30px}header:after{bottom:6px;left:-30px;animation-direction:reverse;content:'🌙 ⭐ 🦠 ⚡ 🪐'}
@keyframes drift{50%{transform:translateX(-40px)}}
@keyframes bgm{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.hero-sub{font-size:1.1rem;opacity:.97}
.mute{position:absolute;top:12px;left:12px;z-index:2;background:rgba(255,255,255,.3);border:0;border-radius:50%;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:2px solid var(--border)}
nav button{background:var(--bot);border:2px solid transparent;padding:8px 16px;font-size:1rem;font-weight:800;color:var(--text);cursor:pointer;border-radius:30px;transition:transform .15s}
nav button:hover{transform:translateY(-2px);border-color:var(--p)}
nav button.active{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.4)}
.container{max-width:1000px;margin:22px auto 90px;padding:0 14px}
.tab{display:none}.tab.active{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h2{font-size:1.9rem;margin-bottom:12px;color:var(--text)}
.card{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:16px;box-shadow:0 6px 0 rgba(124,58,237,.08),0 14px 28px rgba(124,58,237,.10)}
.btn,.link{display:inline-block;color:#fff;border:0;padding:10px 20px;border-radius:16px;font-weight:800;font-size:1rem;cursor:pointer;text-decoration:none;background:linear-gradient(180deg,#8b5cf6,#7c3aed);box-shadow:0 5px 0 #5b21b6;transition:transform .12s,box-shadow .12s}
.btn:hover,.link:hover{transform:translateY(-2px)}.btn:active,.link:active{transform:translateY(4px);box-shadow:0 1px 0 #5b21b6}
.btn.gray{background:linear-gradient(180deg,#94a3b8,#64748b);box-shadow:0 5px 0 #475569}
.link{background:linear-gradient(180deg,#fb7185,#e11d48);box-shadow:0 5px 0 #9f1239}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0}
input,select{padding:9px 14px;border:2px solid var(--border);border-radius:14px;background:var(--bot);color:var(--text);font-size:1rem}
input[type=range]{flex:1;min-width:160px;padding:0;accent-color:#7c3aed;height:8px}
input[type=text]{flex:1;min-width:200px}
/* الرئيسية */
.hero{background:linear-gradient(135deg,#7c3aed,#ec4899 60%,#f59e0b);color:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 0 rgba(91,33,182,.25),0 18px 36px rgba(124,58,237,.35);margin-bottom:18px}
.hero-t{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.hero h2{color:#fff;margin:0}.hero .big{font-size:3.4rem;animation:flt 3s ease-in-out infinite}
.hero .pbar{background:rgba(255,255,255,.3)}.hint{margin:6px 0 12px;opacity:.95}
.big-btn{font-size:1.2rem;padding:14px 26px;background:linear-gradient(180deg,#fde047,#f59e0b);color:#451a03;box-shadow:0 6px 0 #b45309}
.big-btn:active{box-shadow:0 1px 0 #b45309}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.tile{border:0;border-radius:24px;padding:20px 12px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s cubic-bezier(.3,1.6,.5,1);box-shadow:0 8px 0 rgba(0,0,0,.18)}
.tile:hover{transform:translateY(-6px) rotate(-1deg)}.tile:active{transform:translateY(3px)}
.tile span{font-size:2.8rem}.tile b{font-size:1.5rem}.tile small{opacity:.95}
.t1{background:linear-gradient(135deg,#8b5cf6,#6d28d9)}.t2{background:linear-gradient(135deg,#f97316,#ef4444)}.t3{background:linear-gradient(135deg,#06b6d4,#2563eb)}.t4{background:linear-gradient(135deg,#10b981,#059669)}
.factbox{font-size:1.1rem;font-weight:700;text-align:center}
.pbar{height:16px;background:var(--border);border-radius:10px;overflow:hidden}
.pbar div{height:100%;background:linear-gradient(90deg,#34d399,#fde047,#fb7185);transition:width .6s;border-radius:10px}
/* الدروس */
.unit{margin:24px 0 12px;font-family:'Lalezar','Tajawal';font-size:1.35rem;padding:8px 18px;border-radius:18px;background:linear-gradient(90deg,var(--tint),transparent);border-right:8px solid var(--p)}
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.lcard{border:0;border-radius:26px;padding:18px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.25);background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 60%,#1e1b4b));box-shadow:0 8px 0 color-mix(in srgb,var(--c) 45%,#000),0 14px 24px rgba(0,0,0,.18);transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
.lcard:hover{transform:translateY(-8px) scale(1.04)}.lcard:active{transform:translateY(4px)}
.lcard span{font-size:2.5rem;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;animation:flt 3s ease-in-out infinite}
.lcard b{font-size:1.2rem;line-height:1.3}.lcard small{opacity:.95;font-size:.85rem}
.lcard.lock{filter:grayscale(.85) brightness(.9);opacity:.75}
@keyframes flt{50%{transform:translateY(-6px)}}
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;padding:14px 18px;border-radius:24px;color:#fff;background:linear-gradient(120deg,var(--c),#7c3aed);box-shadow:0 8px 0 rgba(0,0,0,.15)}
.lhead h2{margin:0;color:#fff;flex:1;font-size:1.7rem}.lhead small{flex-basis:100%;opacity:.95}
.sec{margin-bottom:26px}
.sec h3{display:inline-block;background:var(--c);color:#fff;padding:6px 22px;border-radius:18px 18px 18px 4px;font-size:1.25rem;margin-bottom:12px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 50%,#000)}
.botnav{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px;padding:16px;border-radius:22px;background:var(--tint)}
/* خريطة ذهنية */
.mm{position:relative;height:440px}
.mm svg{position:absolute;inset:0;width:100%;height:100%}
.n{position:absolute;transform:translate(-50%,-50%);width:34%;padding:10px 12px;border-radius:18px;background:var(--card);border:3px solid var(--c);text-align:center;font-size:.95rem;font-weight:600;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 40%,transparent)}
.n.c{left:50%;top:50%;width:30%;background:linear-gradient(135deg,var(--c),#ec4899);color:#fff;font-family:'Lalezar','Tajawal';font-size:1.3rem;border-radius:60px;border:0;font-weight:400}
.fact{padding:10px 14px;border-radius:14px;border:2px dashed var(--c);color:var(--muted);margin-top:10px;font-weight:600}
@media(max-width:600px){.mm{height:410px}.n{font-size:.76rem;padding:6px;width:40%}.n.c{width:34%;font-size:1rem}header h1{font-size:2rem}}
/* فيديو */
.vwrap{position:relative;padding-bottom:56.25%;height:0;border-radius:20px;overflow:hidden;background:#000;margin-bottom:10px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vplay{position:absolute;inset:0;width:100%;height:100%;border:0;background-size:cover;background-position:center;cursor:pointer;display:flex;align-items:center;justify-content:center}
.vplay span{width:82px;height:82px;border-radius:50%;background:linear-gradient(180deg,#fb7185,#e11d48);color:#fff;font-size:2.2rem;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #9f1239,0 10px 24px rgba(0,0,0,.45);transition:transform .2s;animation:pulse2 1.6s infinite}
.vplay:hover span{transform:scale(1.15)}
@keyframes pulse2{50%{box-shadow:0 6px 0 #9f1239,0 0 0 16px rgba(251,113,133,.25)}}
.vwarn{background:rgba(245,158,11,.16);border:2px solid #f59e0b;border-radius:16px;padding:10px 14px;margin:8px 0;font-weight:600}
.vt{padding:8px 16px}
#d3box{width:100%;height:340px;background:radial-gradient(circle at 50% 40%,var(--bot),var(--tint));border:2px solid var(--border);border-radius:22px;touch-action:none;cursor:grab;box-shadow:inset 0 0 30px rgba(124,58,237,.12)}
.state{font-weight:800;color:var(--p);font-size:1.05rem}
canvas.sim{width:100%;max-width:600px;background:var(--bot);border:2px solid var(--border);border-radius:20px;display:block;margin:6px 0}
.pt{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:8px 0}
.pt button{padding:8px 0;border:0;border-radius:12px;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;transition:transform .15s;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.pt button:hover{transform:scale(1.14)}.pt small{font-weight:400;opacity:.9}
.legend{gap:14px;font-size:.9rem;font-weight:700}
.cellsvg{width:100%;max-width:520px;display:block;margin:8px auto;background:var(--bot);border-radius:20px;border:2px solid var(--border)}
.cellsvg [data-i]{cursor:pointer;transition:filter .15s}.cellsvg [data-i]:hover{filter:brightness(1.25)}
/* أسئلة */
.q{margin-bottom:14px}.q p{font-weight:800;font-size:1.05rem;margin-bottom:10px}
.opt{display:block;width:100%;text-align:right;background:var(--bot);color:var(--text);border:2px solid var(--border);border-radius:16px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:1rem;font-weight:600;transition:transform .15s,border-color .15s}
.opt:hover{border-color:var(--c,var(--p));transform:translateX(-5px)}
.opt.ok{border-color:var(--ok);background:rgba(22,163,74,.2);animation:pulse .4s}.opt.bad{border-color:var(--bad);background:rgba(220,38,38,.2);animation:shake .35s}
@keyframes pulse{50%{transform:scale(1.04)}}@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
.fb{padding:10px 14px;border-radius:14px;margin:8px 0;font-weight:600}.fb.ok{background:rgba(22,163,74,.16)}.fb.bad{background:rgba(220,38,38,.16)}
/* معلم */
.chat{background:var(--card);border:2px solid var(--border);border-radius:24px;display:flex;flex-direction:column;height:440px;overflow:hidden;box-shadow:0 8px 0 rgba(124,58,237,.08)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 16px;border-radius:18px}
.bot{background:var(--bot);align-self:flex-start;border-bottom-right-radius:4px}.user{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;align-self:flex-end;border-bottom-left-radius:4px}
.inp{display:flex;gap:8px;padding:10px;border-top:2px solid var(--border)}.inp input{flex:1}
/* عائم */
.fab{position:fixed;left:14px;bottom:16px;z-index:30;display:flex;flex-direction:column;gap:10px}
.fab button{width:52px;height:52px;border-radius:50%;border:0;font-size:1.5rem;cursor:pointer;color:#fff;background:linear-gradient(180deg,#f472b6,#db2777);box-shadow:0 5px 0 #9d174d,0 8px 18px rgba(0,0,0,.3)}
.fab button+button{background:linear-gradient(180deg,#8b5cf6,#6d28d9);box-shadow:0 5px 0 #4c1d95,0 8px 18px rgba(0,0,0,.3)}
.fab button:active{transform:translateY(4px)}
.cf{position:fixed;top:-40px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

.chat{height:72vh;min-height:480px}
.msg.bot{max-width:94%}
.msg.media{max-width:100%;width:100%;background:var(--card);border:2px solid var(--border);align-self:stretch}
.msg.media .vwrap{margin:8px 0}.msg.media canvas.sim{max-width:100%}
.cbox{width:100%;height:280px;background:radial-gradient(circle at 50% 40%,var(--bot),var(--tint));border-radius:18px;touch-action:none;margin:8px 0}
.msg.media figure{margin:8px 0}.msg.media img{max-width:100%;border-radius:14px;display:block}.msg.media figcaption{font-size:.85rem;color:var(--muted);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:2px solid var(--p);background:var(--card);color:var(--p);border-radius:30px;padding:5px 14px;font-weight:800;cursor:pointer;font-size:.9rem}
.chip:hover{background:var(--p);color:#fff}
.badge{background:var(--tint);padding:4px 14px;border-radius:20px;font-weight:800;font-size:.9rem}
</style>
</head>

<header><button class="mute" id="mute" onclick="toggleMute()">🔊</button><h1>🔭 مُستكشِف العلوم</h1><p class="hero-sub">اكتشف وتعلّم — علوم الصف الأول الإعدادى</p></header>
<nav id="nav"><button class="active" data-t="home">🏠 الرئيسية</button><button data-t="lessons">📚 الدروس</button><button data-t="exam">📝 اختبر نفسك</button><button data-t="tutor">🤖 المعلم الذكى</button><button data-t="res">🔗 المصادر</button></nav>

<section id="home" class="tab active"></section>
<section id="lessons" class="tab"><div id="hub"></div><div id="lv" style="display:none"></div></section>
<section id="exam" class="tab"></section>
<section id="tutor" class="tab"><div class="row"><button class="btn gray" onclick="goHome()">🏠 الرئيسية</button><span class="badge" id="aibadge">📘 المعلم المحلى</span></div><h2>🤖 المعلم الذكى</h2><div class="chat"><div class="msgs" id="chatArea"></div><div class="inp"><input id="ui" placeholder="اسأل بالعامية براحتك... مثلًا: يعنى إيه ذرة؟"><button class="btn" onclick="askBot()">إرسال</button></div></div></section>

<script>
/* ===== دروس علوم أولى إعدادى - الفصل الدراسى الأول ===== */
/* ===== المؤثرات الصوتية =====*/
/* ===== المؤثرات الصوتية (مولَّدة بالكود) ===== */
let AC=null,muted=false;try{muted=localStorage.getItem('mute')==='1'}catch(e){}
function tone(f,d,type,t0,vol){const o=AC.createOscillator(),g=AC.createGain(),s=AC.currentTime+(t0||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(vol||.15,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d)}
function sfx(n){if(muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 const S={click:()=>tone(660,.07,'triangle'),
  ok:()=>{tone(523,.12);tone(659,.12,'sine',.1);tone(784,.25,'sine',.2)},
  bad:()=>{tone(200,.25,'sawtooth',0,.1);tone(150,.3,'sawtooth',.15,.1)},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',i*.12,.18)),
  pop:()=>tone(880,.08),
  zap:()=>{tone(300,.15,'square',0,.07);tone(900,.2,'square',.08,.07)},
  drop:()=>{tone(500,.1);tone(350,.15,'sine',.08)},
  tick:()=>tone(1000,.03,'square',0,.03),
  lock:()=>tone(180,.2,'square',0,.1),
  whoosh:()=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValue
