<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مُستكشِف العلوم | اكتشف وتعلّم – الصف الأول الإعدادى</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7fb;--card:#ffffff;--text:#2b1d4a;--muted:#6b5b8c;--border:#eadcff;--tint:#f3e8ff;--bot:#f6f0ff;--ok:#16a34a;--bad:#dc2626;--p:#7c3aed;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#120b2e;--card:#1d1445;--text:#f5eeff;--muted:#b9a8e6;--border:#3b2b78;--tint:#2b1d63;--bot:#241a57;--p:#a78bfa;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Tajawal',Tahoma,Arial,sans-serif}
h1,h2,h3,h4,.big,.tile b,.lcard b{font-family:'Lalezar','Tajawal',sans-serif;font-weight:400;letter-spacing:.2px}
body{background:var(--bg);background-image:radial-gradient(circle at 8% 8%,rgba(236,72,153,.18),transparent 38%),radial-gradient(circle at 92% 18%,rgba(6,182,212,.18),transparent 38%),radial-gradient(circle at 50% 95%,rgba(245,158,11,.18),transparent 42%);background-attachment:fixed;color:var(--text);line-height:1.78;min-height:100vh;transition:background .3s ease,color .3s ease}
header{position:relative;overflow:hidden;text-align:center;color:#fff;padding:28px 16px 38px;border-radius:0 0 40px 40px;background:linear-gradient(120deg,#7c3aed,#ec4899 45%,#f59e0b);background-size:200% 200%;animation:bgm 10s ease infinite;text-shadow:0 3px 8px rgba(0,0,0,.25);box-shadow:0 10px 30px rgba(124,58,237,.35)}
header h1{font-size:2.55rem;line-height:1.3}
header:before,header:after{content:'⚛️ 🧪 🔬 🌍 🧲';position:absolute;font-size:1.6rem;opacity:.35;white-space:nowrap;animation:drift 14s linear infinite}
header:before{top:10px;right:-30px}header:after{bottom:6px;left:-30px;animation-direction:reverse;content:'🌙 ⭐ 🦠 ⚡ 🪐'}
@keyframes drift{50%{transform:translateX(-40px)}}
@keyframes bgm{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.hero-sub{font-size:1.08rem;opacity:.97}
.mute{position:absolute;top:12px;left:12px;z-index:2;background:rgba(255,255,255,.3);border:0;border-radius:50%;width:44px;height:44px;font-size:1.3rem;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.mute:hover{transform:scale(1.1)}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;padding:10px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:2px solid var(--border)}
nav button{background:var(--bot);border:2px solid transparent;padding:8px 16px;font-size:1rem;font-weight:800;color:var(--text);cursor:pointer;border-radius:30px;transition:transform .2s cubic-bezier(.3,1.6,.5,1),background .2s,border-color .2s}
nav button:hover{transform:translateY(-2px);border-color:var(--p)}
nav button.active{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.4)}
.container{max-width:1040px;margin:22px auto 96px;padding:0 14px;transition:max-width .3s ease}
.container.wide{max-width:1360px}
.tab{display:none}.tab.active{display:block;animation:pop .32s cubic-bezier(.22,1,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
h2{font-size:1.9rem;margin-bottom:12px;color:var(--text)}
.card{background:var(--card);border:2px solid var(--border);border-radius:22px;padding:16px;box-shadow:0 6px 0 rgba(124,58,237,.08),0 14px 28px rgba(124,58,237,.10);transition:transform .2s ease,border-color .2s ease}
.btn,.link{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#fff;border:0;padding:10px 18px;border-radius:16px;font-weight:800;font-size:.98rem;cursor:pointer;text-decoration:none;background:linear-gradient(180deg,#8b5cf6,#7c3aed);box-shadow:0 5px 0 #5b21b6;transition:transform .16s cubic-bezier(.3,1.6,.5,1),box-shadow .16s,filter .2s}
.btn:hover,.link:hover{transform:translateY(-2px);filter:brightness(1.05)}.btn:active,.link:active{transform:translateY(4px);box-shadow:0 1px 0 #5b21b6}
.btn.gray{background:linear-gradient(180deg,#94a3b8,#64748b);box-shadow:0 5px 0 #475569}
.btn.accent{background:linear-gradient(180deg,#ec4899,#db2777);box-shadow:0 5px 0 #9d174d}
.btn.teal{background:linear-gradient(180deg,#14b8a6,#0d9488);box-shadow:0 5px 0 #115e59}
.btn.amber{background:linear-gradient(180deg,#fbbf24,#d97706);color:#2b1600;box-shadow:0 5px 0 #92400e}
.btn.sm{padding:6px 13px;font-size:.88rem;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.link{background:linear-gradient(180deg,#fb7185,#e11d48);box-shadow:0 5px 0 #9f1239}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
input,select,textarea{padding:9px 14px;border:2px solid var(--border);border-radius:14px;background:var(--bot);color:var(--text);font-size:1rem;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(124,58,237,.18)}
input[type=range]{flex:1;min-width:150px;padding:0;accent-color:#7c3aed;height:9px;cursor:pointer}
input[type=text]{flex:1;min-width:200px}

/* الرئيسية */
.hero{background:linear-gradient(135deg,#7c3aed,#ec4899 60%,#f59e0b);color:#fff;border-radius:28px;padding:22px;box-shadow:0 12px 0 rgba(91,33,182,.25),0 18px
